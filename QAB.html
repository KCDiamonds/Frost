<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jr Diamonds QAB">
<meta name="theme-color" content="#111459">
<title>Jr Diamonds Quality At-Bat Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#111459; --cyan:#4FD8EE; --gold:#A8843A;
  --bg:#EDF0F8; --surface:#FFFFFF; --surface2:#F3F5FB; --ink:#111459; --muted:#585D8C; --line:#D6DAEC;
  --gold-ink:#7A5D1F; --gold-soft:#F5ECD4; --gold-line:#D9BF84;
  --hero-bg:#111459; --hero-line:rgba(255,255,255,.16);
  --sel-bg:#111459; --sel-ink:#FFFFFF;
  --strike-bg:#111459; --strike-ink:#FFFFFF;
  --bar-miss:#A6ABD8; --bar-hit:#4FD8EE;
  --danger:#B3261E;
  --shadow:0 1px 2px rgba(17,20,89,.10),0 4px 14px rgba(17,20,89,.06);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#070926; --surface:#11154A; --surface2:#191E5E; --ink:#EEF0FF; --muted:#A5AADB; --line:#2C3282;
  --gold-ink:#E6C373; --gold-soft:#3A3322; --gold-line:#7A6430;
  --hero-bg:#0D1142; --hero-line:rgba(255,255,255,.14);
  --sel-bg:#4FD8EE; --sel-ink:#111459;
  --strike-bg:#3640C4; --strike-ink:#FFFFFF;
  --bar-miss:#363C93; --bar-hit:#4FD8EE;
  --danger:#FF8A80;
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1,h2,h3,p{margin:0}
.display,.num{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mono{font-family:"Space Mono",ui-monospace,Menlo,monospace}
.muted{color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* header */
.top{padding:calc(12px + env(safe-area-inset-top)) 0 10px}
.top .wrap{display:flex;align-items:center;gap:12px}
.top img{width:46px;height:46px;flex:none}
.top h1{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:600;font-size:24px;line-height:1.05}
.top .sub{font-size:13px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;color:var(--muted);font-size:12px;font-weight:600}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--cyan)}

/* cards and layout */
.stack>*+*{margin-top:14px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.card h2{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:600;font-size:20px;margin-bottom:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-head h2{margin:0}
.game-grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;border:1.5px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}
.row.wrap-r{flex-wrap:wrap}
.spacer{flex:1}

/* inputs */
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input::placeholder{color:var(--muted);opacity:.8}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field+.field{margin-top:12px}

/* hero scoreboard */
.hero{background:var(--hero-bg);color:#fff;border-radius:18px;padding:18px 18px 16px;border:1px solid var(--hero-line)}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .big{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:700;font-size:clamp(68px,20vw,108px);line-height:.88;font-variant-numeric:tabular-nums}
.hero .unit{font-size:.42em;margin-left:3px;color:var(--cyan);font-weight:600}
.hero .meta{text-align:right;padding-bottom:4px}
.hero .meta .m1{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-size:26px;font-weight:600;line-height:1.1}
.hero .meta .m2{font-size:13px;color:rgba(255,255,255,.72)}
.track{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.15);margin:24px 0 32px}
.track .fill{height:100%;border-radius:7px;background:var(--cyan)}
.track .tick{position:absolute;top:-7px;bottom:-7px;width:4px;margin-left:-2px;border-radius:2px;background:#E6C373}
.track .glabel{position:absolute;top:22px;transform:translateX(-50%);font-size:12px;font-weight:600;color:#E6C373;white-space:nowrap}
.hero .status{font-size:15px;font-weight:500}
.pips{display:flex;flex-wrap:wrap;gap:2px 3px;margin-top:14px;min-height:18px}
.pip{width:11px;height:11px;transform:rotate(45deg);margin:4px 4px;border:1.5px solid rgba(255,255,255,.4);border-radius:2px}
.pip.q{background:#E6C373;border-color:#E6C373}
.pip-legend{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}

/* game bar */
.gamebar{display:flex;gap:8px;align-items:center}
.gamebar select{flex:1;min-width:0}

/* batter grid */
.batters{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bat{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;min-height:66px;display:flex;flex-direction:column;justify-content:space-between}
.bat .n{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-size:20px;font-weight:600;line-height:1}
.bat .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bat .st{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.bat[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}

/* logger */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink)}
.at-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 8px}
.at-head .lbl{font-size:13px;color:var(--muted)}
.at-head .who{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-size:26px;font-weight:600;line-height:1.1}
.countbox{text-align:right}
.countbox .c{font-family:"Space Mono",ui-monospace,monospace;font-weight:700;font-size:34px;line-height:1}
.countbox .cl{font-size:12px;color:var(--muted)}
.hist{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;align-items:center;margin-bottom:8px}
.ph{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:"Space Mono",ui-monospace,monospace;font-weight:700;font-size:13px;border:1.5px solid var(--line);background:var(--surface2)}
.ph-C,.ph-S{background:var(--strike-bg);color:var(--strike-ink);border-color:var(--strike-bg)}
.ph-F{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-line)}
.ph-X{background:var(--cyan);color:#111459;border-color:var(--cyan)}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.hint{font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.hint.done{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-ink)}
.pbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pb{position:relative;min-height:78px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;line-height:1.1}
.pb b{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:600;font-size:20px}
.pb small{font-size:12px;color:inherit;opacity:.75}
.pb:active{transform:scale(.97)}
.pb.strike{background:var(--strike-bg);color:var(--strike-ink);border-color:var(--strike-bg)}
.pb.foul{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-line)}
.pb.play{background:var(--cyan);color:#111459;border-color:var(--cyan)}
.pb .k{position:absolute;top:6px;right:8px;font-family:"Space Mono",ui-monospace,monospace;font-size:11px;opacity:.6}
.logger-actions{display:flex;gap:10px;margin-top:12px}
.logger-actions .btn{flex:1}
.quick{text-align:center;padding:10px 0 2px}
.quick p{margin-bottom:14px;color:var(--muted);font-size:15px}
.quick .btn{width:100%;min-height:56px;font-size:18px}

/* ledger */
.ledger{list-style:none;margin:0;padding:0}
.ab{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.ledger li:first-child .ab{border-top:0}
.mark{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);color:var(--muted)}
.mark.q{background:var(--gold);border-color:var(--gold);color:#fff}
.mark svg{width:18px;height:18px}
.ab-main{flex:1;min-width:0}
.ab-who{font-weight:600}
.ab-sub{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold-line)}
.ab-n{font-family:"Space Mono",ui-monospace,monospace;font-size:13px;color:var(--muted);padding-top:2px}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}

/* season chart */
.chart{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.chart-in{position:relative;display:flex;gap:10px;min-width:100%;width:max-content}
.plot{position:relative;height:150px;display:flex;gap:10px;align-items:flex-end}
.col{width:52px;height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col .v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:3px}
.col .b{width:100%;border-radius:6px 6px 2px 2px;background:var(--bar-miss)}
.col .b.hit{background:var(--bar-hit)}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);pointer-events:none}
.goalline span{position:absolute;right:0;top:-20px;font-size:12px;font-weight:700;color:var(--gold-ink);background:var(--surface);padding:0 4px}
.xl{display:flex;gap:10px;margin-top:6px}
.xl button{width:52px;text-align:center;font-size:12px;line-height:1.2;color:var(--muted)}
.xl b{display:block;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bars */
.bars>*+*{margin-top:12px}
.barrow .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.barrow .t b{font-weight:600}
.barrow .t span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}

/* player table */
.ptable{width:100%}
.ptable .hd,.ptable .pr{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px 74px;gap:6px;align-items:center;padding:10px 0}
.ptable .hd{font-size:13px;color:var(--muted);font-weight:600;border-bottom:1.5px solid var(--line);padding-top:0}
.ptable .hd button{font-weight:600;color:inherit;text-align:right;min-height:32px}
.ptable .hd button:first-child{text-align:left}
.ptable .hd button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.ptable .pr{width:100%;border-bottom:1px solid var(--line);text-align:left}
.ptable .pr .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptable .pr .nm small{color:var(--muted);font-weight:500;margin-right:6px}
.ptable .pr .c{text-align:right;font-variant-numeric:tabular-nums}
.ptable .pr .c.r{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:600;font-size:19px}
.ptable .pr .c.r.hit{color:var(--gold-ink)}
.ptable .pr.zero{opacity:.55}

/* roster */
.roster-row{display:grid;grid-template-columns:36px 50px minmax(0,1fr) 42px;gap:6px;align-items:center;border-radius:12px}
.iconbtn.sm{width:42px;height:44px;border-radius:10px}
.iconbtn.sm svg{width:18px;height:18px}
.iconbtn[disabled]{opacity:.3}
.roster-row+.roster-row{margin-top:8px}
.goals{display:grid;grid-template-columns:1fr;gap:12px}
details.ref summary{font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center}
details.ref ol{margin:6px 0 0;padding-left:22px}
details.ref li{margin:6px 0}
.note{font-size:14px;color:var(--muted)}
.warn{background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:14px}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(4,5,28,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
.sheet-head h2{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:600;font-size:24px;flex:1}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 16px;flex:1}
.sheet-foot{display:flex;align-items:center;gap:12px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.verdict{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:700}
.verdict svg{width:22px;height:22px;flex:none}
.verdict.q{color:var(--gold-ink)}
.verdict.n{color:var(--muted)}
.grp{margin-top:16px}
.grp h3{font-size:14px;font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;font-weight:600;background:var(--surface2)}
.chip[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.crits{display:grid;gap:8px}
.crit{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 12px;min-height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2)}
.crit .bx{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.crit .bx svg{width:16px;height:16px}
.crit .tx{flex:1;font-size:15px;line-height:1.3}
.crit .au{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--cyan);color:#111459}
.crit[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold-line)}
.crit[aria-pressed="true"] .bx{background:var(--gold);border-color:var(--gold);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-size:22px;font-weight:600;line-height:1}
.stepper .val{min-width:44px;text-align:center;font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-size:24px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tip{margin-top:14px;font-size:14px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lrow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .sm{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.lrow .sm[disabled]{opacity:.3}
.lrow .sm svg{width:18px;height:18px}
.lrow .cb{width:44px;height:44px;display:grid;place-items:center}
.lrow .cb i{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.lrow .cb[aria-pressed="true"] i{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.lrow .cb i svg{width:16px;height:16px}
.lrow.off .nm{opacity:.55}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;border:1px solid var(--cyan);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100vw - 32px);text-align:center}
html[data-theme="dark"] .toast{background:var(--cyan);color:#111459}

.handle{width:36px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;border-radius:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.handle svg{width:22px;height:22px}
.lrow .handle{width:44px}
.sorting [data-row]:not(.dragging){transition:transform .16s ease}
[data-row].dragging{position:relative;z-index:6;background:var(--surface);box-shadow:0 8px 24px rgba(5,6,40,.28);border-radius:12px;transition:none}
[data-row].dragging .handle{cursor:grabbing;color:var(--ink)}
body.no-select{-webkit-user-select:none;user-select:none}
@media (min-width:600px){
  .pb{min-height:88px}
  .goals{grid-template-columns:1fr 1fr}
}
@media (min-width:768px){
  body{padding-bottom:40px}
  .wrap{padding:0 24px}
  .nav{position:static;border:0;background:none;max-width:1100px;margin:0 auto 14px;padding:0 24px;gap:8px;justify-content:flex-start}
  .nav button{flex:none;flex-direction:row;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-size:15px;border:1.5px solid var(--line);background:var(--surface)}
  .nav button[aria-current="page"]{box-shadow:none;background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
  .nav button svg{width:20px;height:20px}
  .game-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:start}
  .col-log{position:sticky;top:12px}
  .backdrop{align-items:center}
  .sheet{border-radius:22px;max-height:88vh}
  .toast{bottom:28px}
  .batters{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
}
@media (max-width:380px){

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var KEY = 'jrd-qab-v1';
var CRITERIA = [
  {key:'sac',   short:'Sac or hit and run', label:'Executed a hit and run, sac bunt, sac drag, or squeeze'},
  {key:'bunt',  short:'Bunt for a hit',     label:'Executed a bunt for a hit'},
  {key:'walk',  short:'Walk, HBP, or CI',   label:'Walk, hit by pitch, or catcher\u2019s interference'},
  {key:'adv',   short:'Runner 2nd to 3rd',  label:'Moved a runner from 2nd to 3rd with 0 outs'},
  {key:'score3',short:'Scored from 3rd',    label:'Drove in a run from 3rd with less than 2 outs'},
  {key:'rbi',   short:'RBI',                label:'Any RBI (sac fly, 2 out RBI, and so on)'},
  {key:'hard',  short:'Hard hit ball',      label:'Hard hit ball (a bloop hit does not count, we want hard contact)'},
  {key:'p8',    short:'8+ pitches',         label:'8 or more pitch at-bat'},
  {key:'p02',   short:'4+ after 0-2',       label:'Saw 4 or more pitches after falling behind 0-2'}
];
var OUT_LABEL = {'1B':'Single','2B':'Double','3B':'Triple','HR':'Home run','BB':'Walk','HBP':'Hit by pitch','CI':'Catcher\u2019s interference','E':'Reached on error','FC':'Fielder\u2019s choice','Ks':'Strikeout swinging','Kl':'Strikeout looking','GO':'Ground out','FO':'Fly out','LO':'Line out','PO':'Pop out','SAC':'Sac bunt','SF':'Sac fly'};
var OUT_GROUPS = [['Hits',['1B','2B','3B','HR']],['Reached base',['BB','HBP','CI','E','FC']],['Outs',['Ks','Kl','GO','FO','LO','PO']],['Sacrifice',['SAC','SF']]];
var SUGGEST = {BB:['walk'],HBP:['walk'],CI:['walk'],SAC:['sac'],SF:['rbi']};
var PITCH_NAME = {B:'Ball',C:'Called strike',S:'Swing and miss',F:'Foul',X:'In play',H:'Hit by pitch'};

/* ---------- state ---------- */
var storageOK = true;
function fresh(){
  var T=[['Irelyn Zahabi','33'],['Harper Sherman','12'],['Sophia Smith','30'],['Felicity Lang','11'],['Ellie Riffel','3'],['Kyla Mayes','17'],['Stephanie Kersting','37'],['Coco Hartley','99'],['Katie Evans','2'],['Avery Wyrick','5'],['Gracie Austin','22'],['Cassidy Fossett','00']];
  var r=T.map(function(t,i){return {id:'p'+(i+1),name:t[0],num:t[1]};});
  return {v:1,theme:null,mode:'live',goals:{game:54,season:50},roster:r,games:[],curGame:null};
}
function migrate(s){
  var f=fresh(), o={};
  o.v=1; o.theme=s.theme||null; o.mode=s.mode==='quick'?'quick':'live';
  o.goals={game:+(s.goals&&s.goals.game)||f.goals.game, season:+(s.goals&&s.goals.season)||f.goals.season};
  o.roster=Array.isArray(s.roster)&&s.roster.length?s.roster:f.roster;
  var allPlaceholder=o.roster.every(function(p){return /^Player \d+$/.test(p.name)&&(p.num===''||p.num==null);});
  if(allPlaceholder){var byId={};f.roster.forEach(function(p){byId[p.id]=p;});o.roster=o.roster.map(function(p,i){return byId[p.id]||f.roster[i]||p;});}
  o.games=Array.isArray(s.games)?s.games:[];
  o.games.forEach(function(g){g.abs=g.abs||[];g.lineup=g.lineup||[];g.pitches=g.pitches||[];g.inning=g.inning||1;});
  o.curGame=s.curGame;
  if(!o.games.some(function(g){return g.id===o.curGame;})) o.curGame=o.games.length?o.games[o.games.length-1].id:null;
  return o;
}
function load(){
  try{
    localStorage.setItem(KEY+'-t','1'); localStorage.removeItem(KEY+'-t');
    var raw=localStorage.getItem(KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){ storageOK=false; }
  return fresh();
}
var state=load();
var ui={tab:'game',sheet:null,sort:'pct'};
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); storageOK=true; }catch(e){ storageOK=false; }
}

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return s||'';return MONTHS[+m[2]-1]+' '+(+m[3]);}
function fmtPct(r){return Math.round(r*100)+'%';}
function fmtAvg(r){var s=r.toFixed(3);return r>=1?s:s.replace(/^0/,'');}
function plural(n,a,b){return n===1?a:(b||a+'s');}
function player(id){for(var i=0;i<state.roster.length;i++)if(state.roster[i].id===id)return state.roster[i];return null;}
function pname(id){var p=player(id);return p?p.name:'Removed player';}
function pnum(p){return p&&p.num!==''&&p.num!=null?String(p.num):'';}
function plabel(p){return p?(pnum(p)?'#'+pnum(p)+' ':'')+p.name:'Removed player';}
function firstName(n){n=String(n);return /^Player \d+$/.test(n)?n:n.split(' ')[0];}
function curGame(){for(var i=0;i<state.games.length;i++)if(state.games[i].id===state.curGame)return state.games[i];return null;}
function sortedGames(){return state.games.slice().sort(function(a,b){return a.date===b.date?(a.created||0)-(b.created||0):(a.date<b.date?-1:1);});}
function gStats(g){var pa=g.abs.length,q=0;g.abs.forEach(function(a){if(a.qab)q++;});return {pa:pa,q:q,rate:pa?q/pa:0};}
function sStats(){var pa=0,q=0;state.games.forEach(function(g){var s=gStats(g);pa+=s.pa;q+=s.q;});return {pa:pa,q:q,rate:pa?q/pa:0};}
function allAbs(){var out=[];state.games.forEach(function(g){g.abs.forEach(function(a){out.push(a);});});return out;}
function pStats(pid,abs){var pa=0,q=0;abs.forEach(function(a){if(a.pid===pid){pa++;if(a.qab)q++;}});return {pa:pa,q:q,rate:pa?q/pa:0};}
function needStraight(q,pa,goal){if(pa===0)return 0;if(q/pa>=goal-1e-9)return 0;return Math.ceil((goal*pa-q)/(1-goal)-1e-9);}
function cushion(q,pa,goal){if(pa===0||q/pa<goal-1e-9)return 0;return Math.max(0,Math.floor(q/goal-pa+1e-9));}
function statusLine(q,pa,goal,goalText){
  if(pa===0)return 'No at-bats logged yet.';
  var n=needStraight(q,pa,goal);
  if(n>0)return 'Need '+n+' straight QAB'+(n===1?'':'s')+' to reach '+goalText+'.';
  var c=cushion(q,pa,goal);
  if(c>0)return 'At goal, with room for '+c+' non-QAB at-bat'+(c===1?'':'s')+'.';
  return 'At goal, with no room to spare.';
}
function critCounts(abs){
  var counts={},q=0;CRITERIA.forEach(function(c){counts[c.key]=0;});
  abs.forEach(function(a){if(a.qab){q++;(a.flags||[]).forEach(function(k){if(counts[k]!=null)counts[k]++;});}});
  return {counts:counts,q:q};
}
function shortName(k){for(var i=0;i<CRITERIA.length;i++)if(CRITERIA[i].key===k)return CRITERIA[i].short;return k;}

/* pitch logic */
function countOf(p){
  var b=0,s=0,at02=null;
  for(var i=0;i<p.length;i++){
    var c=p[i];
    if(c==='B')b++;
    else if(c==='C'||c==='S')s++;
    else if(c==='F'){if(s<2)s++;}
    if(b===0&&s===2&&at02===null)at02=i+1;
  }
  return {b:b,s:s,n:p.length,down02:at02!==null,after02:at02!==null?p.length-at02:0};
}
function suggestSet(d){
  var set={};
  (SUGGEST[d.outcome]||[]).forEach(function(k){set[k]=true;});
  if(d.pitchCount>=8)set.p8=true;
  if(d.down02&&d.after02>=4)set.p02=true;
  return set;
}
function effective(d){
  var sug=suggestSet(d),out={};
  CRITERIA.forEach(function(c){
    var m=d.manual[c.key],auto=!!sug[c.key];
    out[c.key]={on:m===undefined?auto:m,auto:auto&&m===undefined};
  });
  return out;
}

/* ---------- theme ---------- */
function resolveTheme(){
  if(state.theme==='light'||state.theme==='dark')return state.theme;
  try{return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){return 'light';}
}

/* ---------- views ---------- */
function hero(o){
  var fillW=Math.max(0,Math.min(100,o.rate*100));
  var gp=Math.max(0,Math.min(100,o.goal*100));
  var lp=Math.max(10,Math.min(90,gp));
  return '<section class="hero" aria-label="'+esc(o.aria)+'">'+
    '<div class="hero-top"><div class="big">'+esc(o.big)+(o.unit?'<span class="unit">'+o.unit+'</span>':'')+'</div>'+
    '<div class="meta"><div class="m1">'+o.q+' QAB</div><div class="m2">'+o.pa+' plate '+plural(o.pa,'appearance')+'</div></div></div>'+
    '<div class="track" role="img" aria-label="'+esc(o.aria+', goal '+o.goalText)+'"><div class="fill" style="width:'+fillW+'%"></div><div class="tick" style="left:'+gp+'%"></div><div class="glabel" style="left:'+lp+'%">Goal '+esc(o.goalText)+'</div></div>'+
    '<p class="status">'+esc(statusLine(o.q,o.pa,o.goal,o.goalText))+'</p>'+
    (o.extra||'')+
  '</section>';
}

function emptyGame(){

}

function gameBar(g){

    return '<option value="'+esc(x.id)+'"'+(x.id===g.id?' selected':'')+'>'+esc(fmtDate(x.date))+' vs '+esc(x.opp||'Opponent')+'</option>';

function batterGrid(g){
  var cells=g.lineup.map(function(pid){
    var p=player(pid); if(!p)return '';
    var s=pStats(pid,g.abs);
    var n=pnum(p)||String(g.lineup.indexOf(pid)+1);

function liveHints(c){
  var h=[];
  if(c.n>=8)h.push({t:'8+ pitch QAB earned',d:true});
  else h.push({t:(8-c.n)+' more '+plural(8-c.n,'pitch')+' for 8+',d:false});
  if(c.down02){
    if(c.after02>=4)h.push({t:'4+ after 0-2 earned',d:true});
    else h.push({t:(4-c.after02)+' more after 0-2',d:false});
  }
  return h;
}

function logger(g){
  var p=player(g.cur);
  var seg='<div class="seg" role="group" aria-label="Logging mode"><button data-act="set-mode" data-v="live" aria-pressed="'+(state.mode==='live')+'">Live pitches</button><button data-act="set-mode" data-v="quick" aria-pressed="'+(state.mode==='quick')+'">Quick log</button></div>';
  if(!g.lineup.length||!p){
    return '<div class="card">'+seg+'<div class="empty"><p>Add players to this game\u2019s lineup to start logging.</p><button class="btn primary" data-act="edit-game">Edit lineup</button></div></div>';
  }
  var head='<div class="at-head"><div><div class="lbl">At bat</div><div class="who">'+esc(plabel(p))+'</div></div>';
  if(state.mode==='quick'){
    return '<div class="card">'+seg+head+'</div><div class="quick"><p>Log the result after the at-bat. Add the pitch count if you have it.</p>'+'<button class="btn primary" data-act="quick-ab">Log at-bat for '+esc(firstName(p.name))+'</button></div></div>';
  }
  var c=countOf(g.pitches);
  var hist=g.pitches.length?g.pitches.map(function(x,i){return '<span class="ph ph-'+x+'" title="'+esc(PITCH_NAME[x]||x)+'" aria-label="Pitch '+(i+1)+': '+esc(PITCH_NAME[x]||x)+'">'+x+'</span>';}).join(''):'<span class="note">No pitches yet. Tap each pitch as it is thrown.</span>';
  var hints=liveHints(c).map(function(h){return '<span class="hint'+(h.d?' done':'')+'">'+esc(h.t)+'</span>';}).join('');
  var btn=function(v,cls,title,sub){return '<button class="pb '+cls+'" data-act="pitch" data-v="'+v+'"><span class="k">'+v+'</span><b>'+title+'</b><small>'+sub+'</small></button>';};
  return '<div class="card">'+seg+
    '<div class="at-head"><div><div class="lbl">At bat</div><div class="who">'+esc(plabel(p))+'</div></div>'+
    '<div class="countbox"><div class="c" aria-label="Count '+c.b+' balls '+c.s+' strikes">'+c.b+'-'+c.s+'</div><div class="cl">Pitch '+c.n+'</div></div></div>'+
    '<div class="hist">'+hist+'</div><div class="hints">'+hints+'</div>'+
    '<div class="pbtns">'+
      btn('B','ball','Ball','')+btn('C','strike','Strike','Looking')+btn('S','strike','Strike','Swinging')+
      btn('F','foul','Foul','')+btn('X','play','In play','')+btn('H','ball','HBP','')+
    '</div>'+
    '<div class="logger-actions"><button class="btn" data-act="undo-pitch"'+(g.pitches.length?'':' disabled')+'>Undo pitch</button><button class="btn" data-act="end-ab"'+(g.pitches.length?'':' disabled')+'>End at-bat</button></div>'+
  '</div>';
}

function ledger(g){
  var items=g.abs.slice().reverse().map(function(a,i){
    var n=g.abs.length-i;
    var p=player(a.pid);
    var sub=[OUT_LABEL[a.outcome]||a.outcome];
    if(a.pitchCount)sub.push(a.pitchCount+' '+plural(a.pitchCount,'pitch','pitches'));
    if(a.inning)sub.push('inning '+a.inning);
    var tags=(a.flags||[]).map(function(k){return '<span class="tag">'+esc(shortName(k))+'</span>';}).join('');
    return '<li><button class="ab" data-act="edit-ab" data-id="'+esc(a.id)+'">'+
      '<span class="mark'+(a.qab?' q':'')+'">'+(a.qab?I.star:I.ring)+'</span>'+
      '<span class="ab-main"><span class="ab-who">'+esc(plabel(p))+'</span><br><span class="ab-sub">'+esc(sub.join(', '))+'</span>'+(tags?'<span class="tags">'+tags+'</span>':'')+'</span>'+
      '<span class="ab-n">#'+n+'</span></button></li>';
  }).join('');

    (g.abs.length?'<ul class="ledger">'+items+'</ul>':'<div class="empty">Logged at-bats show up here. Tap one to edit it.</div>')+'</div>';
}

function viewGame(){

function critBars(abs){
  var cc=critCounts(abs);

  var rows=CRITERIA.map(function(c){return {c:c,n:cc.counts[c.key]};}).sort(function(a,b){return b.n-a.n;}).map(function(r){
    var w=Math.round(r.n/cc.q*100);
    return '<div class="barrow"><div class="t"><b>'+esc(r.c.short)+'</b><span>'+r.n+' of '+cc.q+'</span></div><div class="bar"><i style="width:'+w+'%"></i></div></div>';
  }).join('');

function viewTeam(){

/* ---------- sheets ---------- */
function stepper(field,val){
  return '<div class="stepper"><button data-act="step" data-f="'+field+'" data-d="-1" aria-label="Decrease">-</button><span class="val" aria-live="polite">'+val+'</span><button data-act="step" data-f="'+field+'" data-d="1" aria-label="Increase">+</button></div>';
}

function abSheet(){
  var s=ui.sheet,d=s.d,g=curGame();
  var eff=effective(d);
  var on=CRITERIA.filter(function(c){return eff[c.key].on;});
  var qab=on.length>0;
  var batter=g.lineup.slice();
  if(batter.indexOf(d.pid)<0)batter.push(d.pid);
  var bopts=batter.map(function(id){return '<option value="'+esc(id)+'"'+(id===d.pid?' selected':'')+'>'+esc(plabel(player(id)))+'</option>';}).join('');
  var outs=OUT_GROUPS.map(function(gr){
    return '<div class="grp"><h3>'+gr[0]+'</h3><div class="chips">'+gr[1].map(function(k){return '<button class="chip" data-act="pick-outcome" data-v="'+k+'" aria-pressed="'+(d.outcome===k)+'">'+esc(OUT_LABEL[k])+'</button>';}).join('')+'</div></div>';
  }).join('');
  var crits=CRITERIA.map(function(c){
    var e=eff[c.key];
    return '<button class="crit" data-act="toggle-crit" data-k="'+c.key+'" aria-pressed="'+e.on+'"><span class="bx">'+I.check+'</span><span class="tx">'+esc(c.label)+'</span>'+(e.auto?'<span class="au">auto</span>':'')+'</button>';
  }).join('');
  var tip='';
  if(!d.outcome)tip='Pick a result to save this at-bat.';
  else if(!qab){
    if(['1B','2B','3B','HR'].indexOf(d.outcome)>=0)tip='A base hit alone does not count. If it was hit hard, turn on Hard hit ball.';
    else if(['GO','FO','LO','PO'].indexOf(d.outcome)>=0)tip='Hard hit outs count. If the contact was loud, turn on Hard hit ball.';
    else tip='No QAB criteria met yet.';
  }
  var del=s.isNew?'':'<button class="btn danger small" data-act="del-ab">Delete</button>';
  return '<div class="backdrop" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+(s.isNew?'Log at-bat':'Edit at-bat')+'">'+
    '<div class="sheet-head"><h2>'+(s.isNew?'Log at-bat':'Edit at-bat')+'</h2><button class="iconbtn" data-act="close-sheet" aria-label="Close">'+I.close+'</button></div>'+
    '<div class="sheet-body">'+
      '<div class="two"><div class="field"><label class="f" for="abBatter">Batter</label><select id="abBatter" data-bind="ab-batter">'+bopts+'</select></div>'+
      '<div class="field"><label class="f">Inning</label>'+stepper('inning',d.inning)+'</div></div>'+
      '<div class="grp"><h3>Result</h3></div>'+outs.replace('<div class="grp">','<div class="grp" style="margin-top:0">')+
      '<div class="grp"><h3>Quality at-bat criteria</h3><div class="crits">'+crits+'</div></div>'+
      '<div class="grp"><h3>Pitches</h3><div class="two"><div><label class="f">Pitches seen</label>'+stepper('pitchCount',d.pitchCount)+'</div>'+
      '<div><label class="f">Fell behind 0-2</label><div class="chips"><button class="chip" data-act="toggle-02" aria-pressed="'+d.down02+'">'+(d.down02?'Yes':'No')+'</button></div></div></div>'+
      (d.down02?'<div style="margin-top:12px"><label class="f">Pitches seen after 0-2</label>'+stepper('after02',d.after02)+'</div>':'')+'</div>'+
      (tip?'<p class="tip">'+esc(tip)+'</p>':'')+
    '</div>'+
    '<div class="sheet-foot"><div class="verdict '+(qab?'q':'n')+'">'+(qab?I.star+'<span>Quality at-bat</span>':'<span>Not a QAB</span>')+'</div>'+del+'<button class="btn primary" data-act="save-ab"'+(d.outcome?'':' disabled')+'>Save</button></div>'+
  '</div></div>';
}

function gameSheet(){
  var s=ui.sheet,d=s.d;
  var rows=d.rows.map(function(r,i){
    var p=player(r.pid);
    var pos=r.on?d.rows.slice(0,i+1).filter(function(x){return x.on;}).length:0;
    return '<div class="lrow'+(r.on?'':' off')+'" data-row data-key="'+esc(r.pid)+'">'+

  }).join('');

    '<div class="sheet-head"><h2>'+(s.isNew?'New game':'Batting order')+'</h2><button class="iconbtn" data-act="close-sheet" aria-label="Close">'+I.close+'</button></div>'+
    '<div class="sheet-body"><div class="two"><div class="field"><label class="f" for="gOpp">Opponent</label><input id="gOpp" placeholder="Team name" value="'+esc(d.opp)+'" data-bind="g-opp"></div>'+
    '<div class="field"><label class="f" for="gDate">Date</label><input id="gDate" type="date" value="'+esc(d.date)+'" data-bind="g-date"></div></div>'+

  '</div></div>';
}

function playerSheet(){
  var p=player(ui.sheet.pid); if(!p)return '';
  var abs=allAbs().filter(function(a){return a.pid===p.id;});
  var s=pStats(p.id,abs),goal=state.goals.season/100;
  var games=sortedGames().map(function(g){
    var mine=g.abs.filter(function(a){return a.pid===p.id;});

    return '<div class="lrow" style="grid-template-columns:minmax(0,1fr) auto"><span class="nm">'+esc(fmtDate(g.date))+' vs '+esc(g.opp||'Opponent')+'</span><span class="num" style="font-size:18px">'+q+' of '+mine.length+'</span></div>';
  }).join('');
  return '<div class="backdrop" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Hitter detail">'+
    '<div class="sheet-head"><h2>'+esc(plabel(p))+'</h2><button class="iconbtn" data-act="close-sheet" aria-label="Close">'+I.close+'</button></div>'+
    '<div class="sheet-body">'+
      '<div class="two" style="margin-bottom:6px"><div><div class="note">QAB average</div><div class="num" style="font-size:44px;font-weight:700;line-height:1;color:'+(s.pa&&s.rate>=goal-1e-9?'var(--gold-ink)':'var(--ink)')+'">'+(s.pa?fmtAvg(s.rate):'-')+'</div></div><div><div class="note">Record</div><div class="num" style="font-size:44px;font-weight:700;line-height:1">'+s.q+' of '+s.pa+'</div></div></div>'+
      '<div class="grp"><h3>How '+esc(firstName(p.name))+' earns QABs</h3>'+critBars(abs)+'</div>'+

function renderSheet(){

  host.innerHTML=ui.sheet.type==='ab'?abSheet():ui.sheet.type==='game'?gameSheet():playerSheet();

function render(){

function toast(msg){

/* ---------- actions ---------- */
function openAB(o){
  var g=curGame(); if(!g)return;
  if(o.edit){
    var a=null; g.abs.forEach(function(x){if(x.id===o.edit)a=x;});
    if(!a)return;
    ui.sheet={type:'ab',isNew:false,id:a.id,t:a.t,d:{pid:a.pid,inning:a.inning||1,outcome:a.outcome,pitchCount:a.pitchCount||0,down02:!!a.down02,after02:a.after02||0,manual:JSON.parse(JSON.stringify(a.manual||{})),pitchLog:a.pitchLog||null}};
  }else{
    var live=!!(o.live||o.finish), c=countOf(g.pitches||[]);
    ui.sheet={type:'ab',isNew:true,d:{pid:g.cur,inning:g.inning||1,outcome:o.outcome||'',pitchCount:live?c.n:0,down02:live?c.down02:false,after02:live?c.after02:0,manual:{},pitchLog:live?g.pitches.slice():null}};
  }
  renderSheet();
}

function saveAB(){
  var s=ui.sheet,d=s.d,g=curGame(); if(!g||!d.outcome)return;
  var eff=effective(d);
  var flags=CRITERIA.filter(function(c){return eff[c.key].on;}).map(function(c){return c.key;});
  var rec={id:s.isNew?uid('a'):s.id,pid:d.pid,inning:d.inning,outcome:d.outcome,pitchCount:d.pitchCount,down02:d.down02,after02:d.after02,manual:d.manual,flags:flags,qab:flags.length>0,pitchLog:d.pitchLog,t:s.isNew?Date.now():s.t};
  if(s.isNew){
    g.abs.push(rec);
    var idx=g.lineup.indexOf(d.pid);
    if(idx>=0)g.cur=g.lineup[(idx+1)%g.lineup.length];
    g.pitches=[]; g.inning=d.inning;
  }else{
    for(var i=0;i<g.abs.length;i++)if(g.abs[i].id===rec.id)g.abs[i]=rec;
  }
  ui.sheet=null; save(); render();
  toast(rec.qab?'Quality at-bat logged':'At-bat logged');
}

function pitch(code){
  var g=curGame(); if(!g||!g.cur)return;
  var before=countOf(g.pitches);
  if(before.b>=4||before.s>=3){toast('That at-bat is over. Undo or end it.');return;}
  g.pitches.push(code);
  var c=countOf(g.pitches),outcome=null;
  if(code==='X')outcome='';
  else if(code==='H')outcome='HBP';
  else if(code==='B'&&c.b>=4)outcome='BB';
  else if((code==='C'||code==='S')&&c.s>=3)outcome=code==='S'?'Ks':'Kl';
  save();
  if(outcome!==null){render();openAB({finish:true,outcome:outcome});}
  else render();
}

function newGameDraft(){
  return {opp:'',date:todayStr(),rows:state.roster.map(function(p){return {pid:p.id,on:true};})};
}
function editGameDraft(g){
  var rows=g.lineup.map(function(id){return {pid:id,on:true};});
  state.roster.forEach(function(p){if(g.lineup.indexOf(p.id)<0)rows.push({pid:p.id,on:false});});
  return {opp:g.opp||'',date:g.date,rows:rows};
}

function saveGame(){
  var s=ui.sheet,d=s.d;
  var lineup=d.rows.filter(function(r){return r.on;}).map(function(r){return r.pid;});
  if(!lineup.length)return;
  if(s.isNew){
    var g={id:uid('g'),created:Date.now(),date:d.date||todayStr(),opp:d.opp.trim(),lineup:lineup,cur:lineup[0],pitches:[],inning:1,abs:[]};
    state.games.push(g); state.curGame=g.id; ui.tab='game';
  }else{
    var g2=curGame();
    g2.opp=d.opp.trim(); g2.date=d.date||g2.date; g2.lineup=lineup;
    if(lineup.indexOf(g2.cur)<0){g2.cur=lineup[0];g2.pitches=[];}
  }
  ui.sheet=null; save(); render();
}

function gameSummary(g){
  var st=gStats(g),goal=state.goals.game;
  var lines=['Jr Diamonds vs '+(g.opp||'Opponent')+' ('+fmtDate(g.date)+')',
    'Team QAB: '+st.q+' of '+st.pa+' ('+fmtPct(st.rate)+'), goal '+goal+'%'];
  var per=[];
  g.lineup.forEach(function(id){var s=pStats(id,g.abs);if(s.pa)per.push(pname(id)+' '+s.q+'/'+s.pa);});
  if(per.length)lines.push('By hitter: '+per.join(', '));
  var cc=critCounts(g.abs);
  var top=CRITERIA.map(function(c){return {c:c,n:cc.counts[c.key]};}).filter(function(r){return r.n>0;}).sort(function(a,b){return b.n-a.n;}).slice(0,3);
  if(top.length)lines.push('Top sources: '+top.map(function(r){return r.c.short+' ('+r.n+')';}).join(', '));
  return lines.join('\n');
}

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(function(){return true;},function(){return fallbackCopy(text);});
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{var t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();t.setSelectionRange(0,text.length);var ok=document.execCommand('copy');t.remove();return ok;}catch(e){return false;}
}

function exportFile(name,text,mime){
  try{
    var file=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:name}).catch(function(e){if(e&&e.name==='AbortError')return;download(name,text,mime);});
    }
  }catch(e){}
  download(name,text,mime);
}
function download(name,text,mime){
  var url=URL.createObjectURL(new Blob([text],{type:mime}));
  var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},3000);
}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCSV(){
  var head=['Date','Opponent','Inning','Jersey','Player','Result','Pitches','Fell behind 0-2','Pitches after 0-2','QAB'].concat(CRITERIA.map(function(c){return c.short;}));
  var rows=[head];
  sortedGames().forEach(function(g){
    g.abs.forEach(function(a){
      var p=player(a.pid);
      rows.push([g.date,g.opp,a.inning,p?p.num:'',p?p.name:'Removed player',OUT_LABEL[a.outcome]||a.outcome,a.pitchCount||0,a.down02?'Y':'N',a.after02||0,a.qab?'Y':'N'].concat(CRITERIA.map(function(c){return (a.flags||[]).indexOf(c.key)>=0?1:0;})));
    });
  });
  return rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
}

/* ---------- drag and drop reorder ---------- */
var drag=null;
function sortReorder(kind,from,to){
  if(kind==='roster'){var r=state.roster,x=r.splice(from,1)[0];r.splice(to,0,x);save();render();}
  else if(kind==='lineup'){var rows=ui.sheet.d.rows,y=rows.splice(from,1)[0];rows.splice(to,0,y);renderSheet();}
}
function dragApply(){
  var d=drag; if(!d)return;
  var dy=(d.y+d.gs())-(d.y0+d.s0);
  var last=d.rows.length-1;
  dy=Math.max(d.tops[0]-d.tops[d.from],Math.min(d.tops[last]-d.tops[d.from],dy));
  d.row.style.transform='translateY('+dy+'px)';
  var center=d.tops[d.from]+d.hts[d.from]/2+dy,to=0;
  d.rows.forEach(function(r,i){if(i!==d.from&&d.tops[i]+d.hts[i]/2<center)to++;});
  d.to=to;
  d.rows.forEach(function(r,i){
    if(i===d.from)return;
    var s=0;
    if(d.from<i&&i<=to)s=-d.stride;else if(to<=i&&i<d.from)s=d.stride;
    r.style.transform=s?'translateY('+s+'px)':'';
  });
}
function dragLoop(){
  var d=drag; if(!d)return;
  var rect=d.sc?d.sc.getBoundingClientRect():{top:0,bottom:window.innerHeight};
  var bottom=rect.bottom-(d.sc?0:72),zone=60,v=0;
  if(d.y<rect.top+zone)v=-Math.min(18,Math.ceil((rect.top+zone-d.y)/3));
  else if(d.y>bottom-zone)v=Math.min(18,Math.ceil((d.y-(bottom-zone))/3));
  if(v){if(d.sc)d.sc.scrollTop+=v;else window.scrollBy(0,v);dragApply();}
  d.raf=requestAnimationFrame(dragLoop);
}
function dragFinish(commit){
  var d=drag; if(!d)return;
  drag=null;
  cancelAnimationFrame(d.raf);
  try{d.h.releasePointerCapture(d.id);}catch(e){}
  d.box.classList.remove('sorting');
  d.row.classList.remove('dragging');
  document.body.classList.remove('no-select');
  d.rows.forEach(function(r){r.style.transform='';});
  if(commit&&d.to!==d.from)sortReorder(d.kind,d.from,d.to);
}
document.addEventListener('pointerdown',function(e){
  var h=e.target.closest&&e.target.closest('[data-handle]'); if(!h||drag)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var box=h.closest('[data-sort]'); if(!box)return;
  var rows=[].slice.call(box.querySelectorAll('[data-row]'));
  var row=h.closest('[data-row]'),from=rows.indexOf(row); if(from<0)return;
  e.preventDefault();
  var sc=h.closest('.sheet-body');
  var gs=function(){return sc?sc.scrollTop:window.scrollY;};
  var s0=gs();
  var tops=rows.map(function(r){return r.getBoundingClientRect().top+s0;});
  var hts=rows.map(function(r){return r.getBoundingClientRect().height;});
  var stride=rows.length>1?(from<rows.length-1?tops[from+1]-tops[from]:tops[from]-tops[from-1]):hts[from];
  drag={h:h,id:e.pointerId,box:box,rows:rows,row:row,from:from,to:from,sc:sc,gs:gs,tops:tops,hts:hts,stride:stride,y0:e.clientY,s0:s0,y:e.clientY,kind:box.dataset.sort,raf:0};
  try{h.setPointerCapture(e.pointerId);}catch(err){}
  box.classList.add('sorting');row.classList.add('dragging');document.body.classList.add('no-select');
  dragLoop();
});
document.addEventListener('pointermove',function(e){if(drag&&e.pointerId===drag.id){drag.y=e.clientY;dragApply();}});
document.addEventListener('pointerup',function(e){if(drag&&e.pointerId===drag.id)dragFinish(true);});
document.addEventListener('pointercancel',function(e){if(drag&&e.pointerId===drag.id)dragFinish(false);});
document.addEventListener('keydown',function(e){
  var h=e.target.closest&&e.target.closest('[data-handle]'); if(!h)return;
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;
  var box=h.closest('[data-sort]'); if(!box)return;
  var rows=[].slice.call(box.querySelectorAll('[data-row]')),from=rows.indexOf(h.closest('[data-row]'));
  var to=from+(e.key==='ArrowUp'?-1:1);
  if(from<0||to<0||to>=rows.length)return;
  e.preventDefault();
  var key=h.dataset.key;
  sortReorder(box.dataset.sort,from,to);
  var nh=document.querySelector('[data-handle][data-key="'+key+'"]'); if(nh)nh.focus();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet){ui.sheet=null;renderSheet();}});
$('#importFile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||!Array.isArray(o.roster)||!Array.isArray(o.games))throw new Error('bad');
      if(!confirm('Replace everything on this device with the backup ('+o.games.length+' '+plural(o.games.length,'game')+')?'))return;
      state=migrate(o);save();render();toast('Backup imported');
    }catch(err){toast('That file is not a Jr Diamonds backup.');}
  };
  r.readAsText(f);
});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!state.theme)render();});}catch(e){}

render();
})();
</script>
</body>
</html>
